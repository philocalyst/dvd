[workspace]
resolver = "3"
members = ["crates/dvd", "crates/dvd-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
rayon = "1"
rustc-hash = "2.1"
crossbeam = "0.8"
subsetter = "0.2"
portable-pty = "0.9"

# The terminal core. Everything about VT state, the grid, and the PTY comes
# from here; `dvd` owns no escape-sequence logic of its own.
#
# `graphics` turns on the Sixel, iTerm2 and Kitty image protocols: decoding,
# the placement bookkeeping, and the geometry helpers for resolving a source
# rect and clipping an overlay against the viewport. Recreating any of that
# would be a second, worse implementation of a protocol the VT core already
# tracks correctly across scroll and resize.
rio-vt = { version = "0.5.5", features = ["graphics"] }
teletypewriter = "0.5.5"

# `termwiz` provides a complete terminal state machine, PTY management, and
# the ability to inherit the caller's own terminal state (colours, size,
# shell) rather than starting from a blank slate. Used by `dvd record` so a
# recording captures the user's actual terminal, not a synthetic one.
# Its recording facilities — capturing the exact byte stream a PTY produces,
# with timing — are modelled on asciinema's approach: a typescript plus a
# wall-clock per write, so the recording can be played back at real speed.
termwiz = "0.23"

# Text. `parley` shapes (harfrust) and resolves fallback (fontique), `skrifa`
# turns the chosen glyphs into outlines. Neither pulls `glifo`.
parley = "0.11"
skrifa = "0.45"

# Rasterization. `default-features = false` is load-bearing: vello_cpu's
# `text` feature is the only edge in the tree that pulls `glifo`, and we
# supply glyph outlines ourselves, so dropping the feature drops the crate.
vello_cpu = { version = "0.1", default-features = false, features = [
	"std",
	"u8_pipeline",
	"multithreading",
] }

# Shared with vello_cpu, which re-exports `vello_common::fearless_simd::Level` —
# the same crate at the same version, so one detected `Level` drives both its
# rasterizer and our kernels.
fearless_simd = "0.4"

image = { version = "0.25", default-features = false, features = ["png"] }
less-avc = { version = "0.1.5", features = ["std"] }
mp4 = "0.14"
xmlwriter = "0.1"
base64 = "0.22"
flate2 = "1"
serde_json = "1"

clap = { version = "4.5", features = ["derive"] }
regex = "1"
strum = { version = "0.27", features = ["derive"] }
rstest = "0.24"
proptest = "1"
